<!doctype html><html lang="de" data-eigenes-design><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sprechtest · Camp de Base</title>
<style>
:root{--night:#0D1017;--snow:#F4F7FB;--soft:#9AA6B8}
html,body{margin:0;background:var(--night);color:var(--snow);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
h1{font-size:26px;margin:8px 0}
h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:22px 0 8px}
p{color:#C9D3E1}
.reihe{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{min-height:52px;border-radius:14px;border:1px solid #ffffff33;background:#1B2333;color:var(--snow);font:600 16px system-ui,sans-serif}
button.on{border-color:#7AA2FF;color:#7AA2FF}
#info,#log{font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--soft);white-space:pre-wrap;background:#141A24;border-radius:12px;padding:12px}
</style></head><body><main>
<h1>Sprechtest</h1>
<p>Bitte jeden Knopf einmal antippen und warten, bis der Satz fertig ist. Unten erscheint, wie lange er gedauert hat. Ein Screenshot der Liste reicht.</p>
<div id="info">Stimmen werden geladen …</div>
<h2>Mit Stimme Thomas (wie die Hörrunde)</h2>
<div class="reihe" id="mit"></div>
<h2>Ohne feste Stimme (nur Sprache fr-FR)</h2>
<div class="reihe" id="ohne"></div>
<h2>Gemessen</h2>
<div id="log">Noch nichts abgespielt.</div>
</main>
<script>
(function(){
'use strict';
const SATZ="Je réfléchis souvent à mes vacances en France.";
const TEMPI=[0.3,0.5,0.7,1,1.5];
const synth=window.speechSynthesis;
const info=document.getElementById('info'),log=document.getElementById('log');
const zeilen=[];
function stimme(){
  const fr=(synth&&synth.getVoices()||[]).filter(v=>/^fr/i.test(v.lang));
  return fr.find(v=>/\bthomas\b/i.test(v.name)&&/fr[-_]FR/i.test(v.lang))||fr.find(v=>/fr[-_]FR/i.test(v.lang))||fr[0]||null;
}
function zeigeInfo(){
  if(!synth){info.textContent='Dieses Gerät kann nicht vorlesen.';return;}
  const v=stimme(),fr=(synth.getVoices()||[]).filter(x=>/^fr/i.test(x.lang));
  info.textContent='Gerät: '+navigator.userAgent.replace(/^Mozilla\/5\.0 /,'')+'\nFranzösische Stimmen: '+fr.length
    +'\nGewählt: '+(v?v.name+' ('+v.lang+')':'keine');
}
function sprich(tempo,mitStimme,btn){
  if(!synth)return;
  if(synth.speaking||synth.pending){synth.cancel();return;}
  const u=new SpeechSynthesisUtterance(SATZ);
  u.lang='fr-FR';
  const v=mitStimme?stimme():null;
  if(v){try{u.voice=v;u.lang=v.lang;}catch(e){}}
  u.rate=tempo;
  let start=0;
  u.onstart=()=>{start=performance.now();};
  u.onend=()=>{btn.classList.remove('on');const ms=start?Math.round(performance.now()-start):null;
    zeilen.push((mitStimme?'Thomas':'ohne  ')+'  Tempo '+String(tempo).padEnd(4)+'  '+(ms!=null?(ms/1000).toFixed(2)+' s':'ohne Messung'));
    log.textContent=zeilen.join('\n');};
  u.onerror=e=>{btn.classList.remove('on');zeilen.push('Fehler: '+(e&&e.error));log.textContent=zeilen.join('\n');};
  btn.classList.add('on');
  synth.speak(u);
}
for(const [id,mit] of [['mit',true],['ohne',false]]){
  const box=document.getElementById(id);
  for(const t of TEMPI){
    const b=document.createElement('button');
    b.textContent='Tempo '+String(t).replace('.',',');
    b.onclick=()=>sprich(t,mit,b);
    box.appendChild(b);
  }
}
zeigeInfo();
if(synth&&synth.addEventListener)synth.addEventListener('voiceschanged',zeigeInfo);
setTimeout(zeigeInfo,800);
})();
</script>
</body></html>
