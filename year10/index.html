<script>
/* Faengt Fehler ab, die sonst zu einer leeren Seite fuehren, und zeigt sie an. */
window.onerror = function(msg, src, line, col){
  try{
    var box = document.getElementById("warn");
    if(!box){
      box = document.createElement("div");
      box.id = "warn";
      document.body.insertBefore(box, document.body.firstChild);
    }
    box.innerHTML = '<div class="warn"><b>Diese Seite laeuft in deinem Browser nicht.</b><br>'
      + 'Wahrscheinlich ist er zu alt fuer eine der verwendeten Funktionen. '
      + 'Bitte diesen Text weitergeben:<br><span style="font-family:monospace;font-size:11px">'
      + String(msg) + ' (Zeile ' + line + ':' + col + ')</span></div>';
  }catch(e){}
  return false;
};
</script>

<style>
:root{
  --ground:#EEF1F3;
  --card:#FFFFFF;
  --ink:#16232B;
  --ink-soft:#5A6B75;
  --rule:#D6DCE0;
  --petrol:#0E5A66;
  --amber:#C9761E;
  --moss:#3F7A4B;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 64px}

/* ---------- Kopfzeile ---------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:28px;flex-wrap:wrap}
.mhead-text{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;min-width:0}
@media(max-width:560px){
  .masthead{align-items:center}
  .mhead-text{gap:2px;display:block}
}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em}
.masthead .sub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft)}
.home-link{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-soft);text-decoration:none;
  white-space:nowrap;align-self:flex-end}
.home-link:hover{color:var(--ink);text-decoration:underline}

/* ---------- Unit-Farben (Variante A: Rand und Kopf) ---------- */
/* Im Schwarz-Weiss-Druck traegt die Kachelbeschriftung die Unterscheidung,
   nicht die Farbe. */
.y10u1{--unit:#2B5F8A; --unit-bg:#E6EDF4; --unit-ink:#1B3C56}
.y10u2{--unit:#B0472A; --unit-bg:#F5E7E1; --unit-ink:#6E2C1A}
.y10u3{--unit:#5B7A2E; --unit-bg:#EBF0E1; --unit-ink:#374A1C}
.y10u4{--unit:#7A5C9E; --unit-bg:#EEE8F3; --unit-ink:#4B3763}

/* Hauptmenue: eigene, von den Units unabhaengige Farbgebung, damit
   Jahrgang, Gesamtliste und Anleitung auf einen Blick auseinanderzuhalten
   sind. */
.home-year{--unit:#0E5A66; --unit-bg:#E4EFF1; --unit-ink:#083C45}   /* Petrol   */
.home-all{--unit:#3F5E8A;  --unit-bg:#E7ECF4; --unit-ink:#24344F}   /* Blau     */
.home-help{--unit:#6B5E3F; --unit-bg:#F1EEE4; --unit-ink:#463C24}   /* Sand     */
.topic.home-year, .topic.home-all, .topic.home-help{
  border-left-color:var(--unit); border-left-width:4px;
  background:var(--unit-bg); border-top-color:transparent;
  border-right-color:transparent; border-bottom-color:transparent}
.topic.home-year .t-name, .topic.home-all .t-name, .topic.home-help .t-name{color:var(--unit-ink)}
.topic.home-year .t-count, .topic.home-all .t-count, .topic.home-help .t-count{color:var(--unit)}
.topic.home-year .minirail i.f{background:var(--unit)}
.topic.home-year:hover, .topic.home-all:hover, .topic.home-help:hover{
  border-color:transparent; border-left-color:var(--unit-ink)}
@media print{
  .topic.home-year, .topic.home-all, .topic.home-help{background:#fff;border:1px solid #000;border-left-width:4px}
  .topic.home-year .t-name, .topic.home-all .t-name, .topic.home-help .t-name,
  .topic.home-year .t-count, .topic.home-all .t-count, .topic.home-help .t-count{color:#000}
}
.uall{--unit:#16232B; --unit-bg:#ECEFF1; --unit-ink:#16232B}

/* ---------- Startseite ---------- */
.yeargroup{margin-bottom:34px}
.yeargroup[class*="u"]{border:none;background:none}
.yearhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer;list-style:none}
.yearhead::-webkit-details-marker{display:none}
.yearhead::after{content:"+";margin-left:auto;font-family:var(--mono);font-size:15px;
  color:var(--unit,var(--ink-soft));flex:0 0 auto}
details[open] > .yearhead::after{content:"\2212"}
.yearhead .tag{font-family:var(--mono);font-size:12px;background:var(--unit,var(--ink));
  color:#fff;padding:2px 7px;border-radius:var(--radius-xs)}
.yeargroup[class*="u"] .yearhead{border-bottom:1px solid var(--unit);padding-bottom:6px}
.yeargroup[class*="u"] .yearhead .name{color:var(--unit)}
.topic[class*="u"]{border-left-color:var(--unit);border-left-width:4px;
  background:var(--unit-bg);border-top-color:transparent;
  border-right-color:transparent;border-bottom-color:transparent}
.topic[class*="u"] .t-name{color:var(--unit-ink)}
.topic[class*="u"] .t-count{color:var(--unit)}
.topic[class*="u"] .t-due{color:var(--unit-ink);font-weight:500}
.topic[class*="u"] .minirail i{background:var(--card)}
.topic[class*="u"] .minirail i.f{background:var(--unit)}
.topic[class*="u"]:hover{border-color:transparent;border-left-color:var(--unit-ink)}
@media print{
  .topic[class*="u"]{background:#fff;border:1px solid #000;border-left-width:4px}
  .topic[class*="u"] .t-name,
  .topic[class*="u"] .t-count,
  .topic[class*="u"] .t-due{color:#000}
  .yearhead .tag{background:#000}
  .yeargroup[class*="u"] .yearhead{border-bottom-color:#000}
  .yeargroup[class*="u"] .yearhead .name{color:#000}
}
.yearhead .name{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--ink-soft)}

.topic{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;
  cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.topic:hover{border-left-color:var(--petrol);transform:translateX(2px)}
.topic:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.topic .t-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.topic .t-name{font-weight:500}
.topic .t-count{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.topic .t-due{color:var(--amber)}
.minirail{display:flex;gap:2px;margin-top:9px}
.minirail i{height:4px;flex:1;background:var(--rule);border-radius:var(--radius-xs)}
.minirail i.f{background:var(--petrol)}

.emptyhint{background:var(--card);border:1px dashed var(--rule);border-radius:var(--r);
  padding:14px 16px;color:var(--ink-soft);font-size:14px}

/* ---------- Sitzung: Leitner-Schiene (Signature) ---------- */
.rail{display:flex;gap:6px;margin-bottom:22px}
.slot{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:7px 6px 6px;text-align:center;position:relative;transition:border-color .2s,background .2s}
.slot .n{font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.06em}
.slot .c{font-family:var(--serif);font-size:19px;line-height:1.1;margin-top:1px}
.slot .iv{font-family:var(--mono);font-size:9px;color:var(--ink-soft);margin-top:2px}
.slot.here{border-color:var(--petrol);background:#E7F0F1}
.slot.here::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;
  transform:translateX(-50%) rotate(45deg);background:#E7F0F1;
  border-right:1px solid var(--petrol);border-bottom:1px solid var(--petrol)}
.slot.land{animation:land .45s ease-out}
@keyframes land{0%{transform:translateY(-6px)}60%{transform:translateY(2px)}100%{transform:none}}

/* Unit-Farbe als Ortsangabe waehrend des Lernens: farbige Kante an der
   Karte, farbige Kopfzeile, farbiges aktives Fach. Sonst nichts. */
.stage[class*="u"] .vcard{border-top:3px solid var(--unit)}
.eyebrow[class*="u"]{color:var(--unit);border-bottom-color:var(--unit)}
.rail[class*="u"] .slot.here{border-color:var(--unit);background:var(--unit-bg)}
.rail[class*="u"] .slot.here::after{background:var(--unit-bg);
  border-right-color:var(--unit);border-bottom-color:var(--unit)}
@media print{
  .stage[class*="u"] .vcard{border-top-color:#000}
  .eyebrow[class*="u"]{color:#000;border-bottom-color:#000}
}

/* ---------- Karte ---------- */
.stage{position:relative}
.vcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:30px 26px;min-height:250px;display:flex;flex-direction:column;
  box-shadow:0 1px 0 var(--rule),0 6px 22px rgba(22,35,43,.06)}
.vcard.deal{animation:deal .28s ease-out}
@keyframes deal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:20px}
.prompt{font-family:var(--serif);font-size:38px;line-height:1.15;letter-spacing:-.015em;margin:0}
.pos{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:15px;margin-top:5px}
.phon{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.ipa{font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.01em}
.speak{padding:5px 9px;line-height:0;border-color:var(--rule);color:var(--petrol)}
.speak:hover{border-color:var(--petrol);background:#E7F0F1}
.speak svg{width:15px;height:15px;display:block}
.speak.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.answer{margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)}
.answer .de{font-family:var(--serif);font-size:23px}
.answer .coll{font-size:13px;color:var(--ink-soft);margin-top:8px}
.answer .ex{font-family:var(--serif);font-style:italic;font-size:16px;margin-top:14px;
  padding-left:12px;border-left:2px solid var(--petrol);color:#31434D}
.answer .ex b{font-style:normal;font-weight:600;color:var(--ink);
  box-shadow:inset 0 -.42em 0 rgba(14,90,102,.14)}
.answer .ex .speak{margin-left:8px;vertical-align:middle;padding:4px 7px}
.answer .ex .speak svg{width:13px;height:13px}
.spacer{flex:1}

/* Hinweis, welche Bedeutung gemeint ist - nur bei Woertern, deren
   Schulbuchliste zwei getrennte Bedeutungen nennt. */
.sense{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);
  margin-top:8px;padding-left:11px;border-left:2px solid var(--rule)}

/* ---------- Bedienelemente ---------- */
.controls{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--rule);
  background:var(--card);color:var(--ink);padding:11px 15px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--ink-soft)}
button:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
button.primary{background:var(--petrol);border-color:var(--petrol);color:#fff;flex:1}
button.primary:hover{background:#0B4A54}
.rate{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px}
.rate span{font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.05em}
.rate.again{border-color:var(--amber);color:var(--amber)}
.rate.again:hover{background:#FBF2E6}
.rate.hard{border-color:var(--ink-soft)}
.rate.hard:hover{background:#EEF1F3}
.rate.good{border-color:var(--moss);color:var(--moss)}
.rate.good:hover{background:#EDF4EE}

.opts{display:grid;gap:8px;margin-top:20px}
.opt{text-align:left;padding:13px 15px;font-family:var(--serif);font-size:17px}
.opt.right{border-color:var(--moss);background:#EDF4EE;color:var(--moss)}
.opt.wrong{border-color:var(--amber);background:#FBF2E6;color:var(--amber)}
.opt:disabled{cursor:default;opacity:1}

.typebox{margin-top:20px}
.typebox input{width:100%;font-family:var(--serif);font-size:22px;padding:12px 14px;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--ground);color:var(--ink)}
.typebox input:focus{outline:2px solid var(--petrol);outline-offset:1px;background:var(--card)}
.verdict{margin-top:12px;font-size:14px}
.verdict.ok{color:var(--moss)}
.verdict.near{color:var(--amber)}
.verdict.no{color:var(--amber)}
.verdict .sol{font-family:var(--serif);font-size:18px;color:var(--ink);display:block;margin-top:3px}

/* ---------- Kopf der Sitzung ---------- */
.sessionbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:18px;flex-wrap:wrap}
.linkbtn{background:none;border:none;padding:4px 0;color:var(--petrol);text-decoration:underline;
  text-underline-offset:3px}
.switches{display:flex;gap:6px;flex-wrap:wrap}
.switch{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:6px 9px;
  text-transform:uppercase}
.switch[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------- Abschluss ---------- */
.done{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:34px 26px;text-align:center}
.done h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 8px}
.done p{color:var(--ink-soft);margin:0 0 20px}

/* ---------- Fußzeile ---------- */
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
.foot button{padding:5px 9px;font-family:var(--mono);font-size:11px}
.warn{background:#FBF2E6;border:1px solid var(--amber);color:#8A4E12;border-radius:var(--r);
  padding:9px 12px;font-size:13px;margin-bottom:20px;line-height:1.4}

/* ---------- Anleitung ---------- */
.doc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:26px 26px 30px;max-width:640px}
.doc h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:34px 0 8px;
  letter-spacing:-.01em}
.doc h2:first-child{margin-top:0}
.doc h3{font-family:var(--sans);font-weight:600;font-size:15px;margin:20px 0 5px}
.doc p{margin:0 0 12px;font-size:15px}
.doc ul{margin:0 0 12px;padding-left:20px;font-size:15px}
.doc li{margin-bottom:5px}
.doc .lead{color:var(--ink-soft)}
.doc code{font-family:var(--mono);font-size:12.5px;background:var(--ground);
  padding:1px 5px;border-radius:var(--radius-xs)}
.doc table{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:14px}
.doc th,.doc td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule)}
.doc th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.doc td:first-child{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:3px;padding:1px 6px;background:var(--ground)}
.doc .warnbox{background:#FBF2E6;border:1px solid var(--amber);border-radius:var(--r);
  padding:12px 14px;font-size:14.5px;margin:0 0 14px;line-height:1.5}
.doc .teacher{border-top:2px solid var(--ink);margin-top:36px;padding-top:18px}
@media print{
  .doc{border:none;padding:0;max-width:none}
  .doc h2{page-break-after:avoid}
}

/* ---------- Lueckensatz ---------- */
.cloze{font-family:var(--serif);font-size:22px;line-height:1.55;margin:0}
.cloze .gap{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--petrol);
  text-align:center;color:var(--petrol);font-family:var(--mono);font-size:15px;
  vertical-align:baseline;padding:0 4px}
.cloze b{font-style:normal;font-weight:600;
  box-shadow:inset 0 -.42em 0 rgba(14,90,102,.18)}
.clue{font-family:var(--serif);font-size:16px;color:var(--ink-soft);margin-top:14px}
.clue span{color:var(--ink)}

/* ---------- Listenansicht ---------- */
.listctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.listctl input[type=search]{flex:1;min-width:180px;font:inherit;font-size:15px;
  padding:10px 13px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--card);color:var(--ink);-webkit-appearance:none}
.listctl input[type=search]:focus{outline:2px solid var(--petrol);outline-offset:1px}
.listcount{font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:16px}

.lsec{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  margin-bottom:8px;overflow:hidden}
.lsec > summary{cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;
  align-items:baseline;gap:12px;list-style:none;font-weight:500}
.lsec > summary::-webkit-details-marker{display:none}
.lsec > summary:hover{background:var(--ground)}
.lsec > summary .lyear{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  background:var(--ink);color:var(--ground);border-radius:var(--radius-xs);padding:2px 6px;margin-right:9px}
.lsec > summary .lnum{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.lsec[open] > summary{border-bottom:1px solid var(--rule)}
.lbody{padding:4px 15px 12px}

.vrow{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;
  padding:9px 0;border-bottom:1px solid var(--ground);break-inside:avoid}
.vrow:last-child{border-bottom:none}
.ven{font-family:var(--serif);font-size:16px}
.vipa{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-left:7px;white-space:nowrap}
.vpos{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink-soft);margin-left:7px}
.vde{font-size:14.5px}
.vsense{display:block;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-soft)}
.vex{grid-column:1 / -1;font-family:var(--serif);font-style:italic;font-size:14px;
  color:#31434D;padding-left:11px;border-left:2px solid var(--rule);margin-top:3px}
.vlist.hide-ex .vex{display:none}
.vlist.hide-ipa .vipa{display:none}
.vrow.off{display:none}
.lsec.off{display:none}
.noresult{background:var(--card);border:1px dashed var(--rule);border-radius:var(--r);
  padding:14px 16px;color:var(--ink-soft);font-size:14px}

@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .masthead{border-bottom:1px solid #000;margin-bottom:14px}
  .sessionbar,.listctl,.foot,#warn,.listcount button{display:none!important}

<script>
/* =========================================================================
   SPEICHER  –  localStorage mit Rückfallebene im Arbeitsspeicher
   ========================================================================= */
const Store = (function(){
  let persistent = true, mem = {};
  try{
    localStorage.setItem("fr10:test","1");
    localStorage.removeItem("fr10:test");
  }catch(e){ persistent = false; }
  return {
    persistent,
    get(k){
      try{
        if(persistent) return localStorage.getItem(k);
        return (k in mem) ? mem[k] : null;
      }catch(e){ return (k in mem) ? mem[k] : null; }
    },
    set(k,v){
      try{ persistent ? localStorage.setItem(k,v) : (mem[k]=v); }
      catch(e){ mem[k]=v; }
    }
  };
})();

const KEY = "fr10:progress";
const INTERVALS = [0,0,1,2,4,8];      // Fach 1..5 -> Tage bis zur Wiedervorlage
const DAY = 86400000;

let progress = (function(){
  try{ return JSON.parse(Store.get(KEY)) || {}; }catch(e){ return {}; }
})();

function save(){ Store.set(KEY, JSON.stringify(progress)); }

function rec(dir, vid){
  if(!progress[dir]) progress[dir] = {};
  if(!progress[dir][vid]) progress[dir][vid] = {box:1, due:0};
  return progress[dir][vid];
}
function isDue(r){ return Date.now() >= r.due; }

function boxCounts(list, dir){
  const c=[0,0,0,0,0];
  for(const v of list) c[rec(dir,v.id).box-1]++;
  return c;
}
function dueCount(list, dir){
  return list.filter(v => isDue(rec(dir,v.id))).length;
}

/* Liefert die Vokabeln zu einer Auswahl. Neben den einzelnen Parts gibt es
   zwei Sammel-IDs: "<unit>-all" fuer eine ganze Unit und "<jahrgang>-all"
   fuer das ganze Buch. Der Lernstand haengt an der Vokabel, nicht an der
   Auswahl - wer eine Unit am Stueck lernt, sieht denselben Fortschritt
   auch in den einzelnen Parts. */
function setOf(id){
  if(SETS[id]) return SETS[id];
  var m = /^(.+)-all$/.exec(id);
  if(!m) return [];
  var key = m[1];
  var parts = TOPICS.filter(function(t){ return t.unit === key; });
  if(!parts.length){
    var yr = YEARS.filter(function(y){ return y.id === key; })[0];
    if(yr) parts = TOPICS.filter(function(t){
      return yr.units.some(function(u){ return u.id === t.unit; }); });
  }
  return parts.reduce(function(a,t){ return a.concat(SETS[t.id]); }, []);
}
function topicName(id){
  var t = TOPICS.filter(function(x){ return x.id === id; })[0];
  if(t) return t.unitName + " \u00b7 " + t.name;
  var m = /^(.+)-all$/.exec(id);
  if(m){
    var u = TOPICS.filter(function(x){ return x.unit === m[1]; })[0];
    if(u) return u.unitName + " \u2013 alle Teile";
    var y = YEARS.filter(function(x){ return x.id === m[1]; })[0];
    if(y) return y.label + (y.book ? " (" + y.book + ")" : "") + " \u2013 alle Unités";
  }
  return id;
}


/* =========================================================================
   AUSSPRACHE  –  Web Speech API des Browsers, keine externe Anbindung
   Nutzt die auf dem Gerät installierten Stimmen. Kein Konto, kein Schlüssel,
   kein Datenversand. Verfügbarkeit und Qualität hängen vom Endgerät ab.
   ========================================================================= */
const Speech = (function(){
  var synth = window.speechSynthesis;
  if(!synth) return {available:false, say:function(){}, status:function(){ return "nicht unterstützt"; }};

  var voice = null;
  var last = "noch nichts abgespielt";

  function pick(){
    var vs = [];
    try{ vs = synth.getVoices() || []; }catch(e){ return; }
    vs = vs.filter(function(v){ return /^fr/i.test(v.lang); });
    if(!vs.length) return;                        // auf iOS anfangs leer
    voice = vs.filter(function(v){ return /fr[-_]FR/i.test(v.lang); })[0]
         || vs[0];
  }
  pick();
  if(synth.addEventListener) synth.addEventListener("voiceschanged", pick);

  return {
    available:true,

    /* Zaehlt die geladenen Stimmen und meldet, was zuletzt passiert ist. */
    status:function(){
      var n = 0;
      try{ n = (synth.getVoices() || []).length; }catch(e){}
      return n + " Stimmen geladen \u00b7 " + (voice ? "gewählt: " + voice.name + " (" + voice.lang + ")"
                                                     : "keine französische Stimme gefunden")
           + " \u00b7 zuletzt: " + last;
    },

    say:function(text, btn){
      try{
        // Laeuft schon etwas? Dann nur abbrechen und beenden. Niemals
        // cancel() unmittelbar vor speak() aufrufen - iOS verschluckt sonst
        // beides und bleibt stumm.
        if(synth.speaking || synth.pending){
          synth.cancel();
          last = "abgebrochen";
          if(btn) btn.classList.remove("on");
          return;
        }

        // Stimmenliste im Moment des Antippens auffrischen; auf iOS ist sie
        // beim Laden der Seite noch leer.
        if(!voice) pick();

        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = "fr-FR";
        if(voice){ try{ u.voice = voice; u.lang = voice.lang || "fr-FR"; }catch(e){} }
        u.rate = 0.9;

        last = "gestartet";
        u.onstart = function(){ last = "spricht"; };
        u.onend   = function(){ last = "fertig"; if(btn) btn.classList.remove("on"); };
        u.onerror = function(ev){
          last = "Fehler: " + ((ev && ev.error) ? ev.error : "unbekannt");
          if(btn) btn.classList.remove("on");
        };

        if(btn) btn.classList.add("on");
        synth.speak(u);                  // direkt aus der Nutzeraktion heraus
        if(synth.paused){ try{ synth.resume(); }catch(e){} }
      }catch(e){
        last = "Ausnahme: " + e.message;
        if(btn) btn.classList.remove("on");
      }
    }
  };
})();

const SPK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
  <path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>`;

function speakBtn(text){
  if(!Speech.available) return "";
  return `<button class="speak" data-say="${esc(text)}" title="Aussprache anhören"
    aria-label="Aussprache von ${esc(text)} anhören">${SPK}</button>`;
}

/* =========================================================================
   HILFSFUNKTIONEN
   ========================================================================= */
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function normalise(s){
  return s.toLowerCase().trim()
    .replace(/[.,;:!?¡¿'"’«»…]/g,"")
    .replace(/\s+/g," ").trim();
}
function distance(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function checkTyped(input, target){
  const a=normalise(input), b=normalise(target);
  if(!a) return "no";
  if(a===b) return "ok";
  // Mehrere zulässige Übersetzungen, durch Komma getrennt
  if(b.split(",").map(s=>s.trim()).includes(a)) return "ok";
  const tol = b.length > 6 ? 2 : 1;
  return distance(a,b) <= tol ? "near" : "no";
}
function markExample(sentence, word, gap, at){
  if(gap && sentence.indexOf(gap) >= 0){
    const i = sentence.substr(at, gap.length) === gap ? at : sentence.indexOf(gap);
    return esc(sentence.slice(0, i)) + "<b>" + esc(gap) + "</b>" + esc(sentence.slice(i + gap.length));
  }
  const stem = word.replace(/^to\s+/i,"").split(/[\s/]/)[0].slice(0, Math.max(4, word.length-3));
  const re = new RegExp("("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","i");
  return esc(sentence).replace(re,"<b>$1</b>");
}

/* =========================================================================
   ZUSTAND
   ========================================================================= */
const S = {
  view:"home",
  yearId:null,
  topicId:null,
  dir:"en2de",          // en2de | de2en
  mode:"card",          // card | mc | type
  onlyDue:true,
  queue:[], i:0, revealed:false, answered:null, landed:null,
  seen:0
};
const view = document.getElementById("view");
const dirLabel = () => S.dir==="en2de" ? "FR → DE" : "DE → FR";
const askSide  = v => S.dir==="en2de" ? v.en : v.de;
const ansSide  = v => S.dir==="en2de" ? v.de : v.en;

/* =========================================================================
   STARTSEITE
   ========================================================================= */
function railFor(list){
  const total = list.length;
  const c = boxCounts(list, S.dir);
  const known = c[2]+c[3]+c[4];
  const filled = total ? Math.round(known/total*5) : 0;
  return `<span class="minirail">${[0,1,2,3,4].map(k=>`<i class="${k<filled?"f":""}"></i>`).join("")}</span>`;
}
function countLabel(list){
  const total = list.length;
  if(!total) return "leer";
  const due = dueCount(list, S.dir);
  return (due ? `<span class="t-due">${due} f\u00e4llig</span> \u00b7 ` : "") + total + " Vok.";
}
function topicRow(id, label, list, cls){
  return `<button class="topic ${cls||""}" data-topic="${id}">
    <span class="t-row">
      <span class="t-name">${esc(label)}</span>
      <span class="t-count">${countLabel(list)}</span>
    </span>
    ${railFor(list)}
  </button>`;
}

/* Startseite: nur die Jahrgaenge mit ihrem Lehrwerk. */
function renderHome(){
  let h = "";
  for(const y of YEARS){
    const list = setOf(y.id + "-all");
    h += `<section class="yeargroup">
      <div class="yearhead"><span class="tag">${esc(y.label)}</span>
      ${y.book ? `<span class="name">${esc(y.book)}</span>` : ""}</div>
      <button class="topic home-year" data-year="${y.id}">
        <span class="t-row">
          <span class="t-name">${esc(y.label)}</span>
          <span class="t-count">${y.units.length} Kapitel \u00b7 ${list.length} Vok.</span>
        </span>
        ${railFor(list)}
      </button>
    </section>`;
  }
  h += `<div class="emptyhint">W\u00e4hle eine Klasse. Der Fortschritt wird pro
        Abfragerichtung (${dirLabel()}) getrennt gespeichert und bleibt auf diesem Ger\u00e4t.</div>`;
  const grand = TOPICS.reduce((n,t) => n + (SETS[t.id] ? SETS[t.id].length : 0), 0);
  h += `<button class="topic home-all" id="allBtn">
    <span class="t-row">
      <span class="t-name">Alle Vokabeln ansehen</span>
      <span class="t-count">${grand} Eintr\u00e4ge</span>
    </span>
  </button>`;
  h += `<button class="topic home-help" id="helpBtn">
    <span class="t-row">
      <span class="t-name">Anleitung</span>
      <span class="t-count">So funktioniert die Seite</span>
    </span>
  </button>`;

  view.innerHTML = h;
  view.querySelectorAll("[data-year]").forEach(b =>
    b.addEventListener("click", () => { S.yearId = b.dataset.year; S.view = "year"; render(); }));
  const ab = document.getElementById("allBtn");
  if(ab) ab.onclick = () => { S.view = "list"; render(); };
  const hb = document.getElementById("helpBtn");
  if(hb) hb.onclick = () => { S.view = "help"; render(); };
  updateFoot();
}

/* Jahrgangsseite: pro Unit ein Abschnitt, darin die Parts als Zeilen,
   dazu je eine Zeile fuer die ganze Unit und eine fuer das ganze Buch. */
function renderYear(){
  const y = YEARS.filter(x => x.id === S.yearId)[0] || YEARS[0];
  let h = `<div class="sessionbar">
      <button class="linkbtn" id="yback">\u2190 Jahrg\u00e4nge</button>
      <div class="switches"><button class="switch" id="ydir">${dirLabel()}</button></div>
    </div>`;

  h += topicRow(y.id + "-all", "Alle Vokabeln des Buches", setOf(y.id + "-all"), "uall");

  for(const u of y.units){
    const parts = TOPICS.filter(t => t.unit === u.id);
    if(!parts.length) continue;
    h += `<details class="yeargroup ${u.id}">
      <summary class="yearhead"><span class="tag">${esc(u.name.split(" \u2013 ")[0])}</span>
      <span class="name">${esc(u.name.split(" \u2013 ").slice(1).join(" \u2013 ")
        || setOf(u.id + "-all").length + " Vokabeln \u00b7 " + parts.length + (parts.length === 1 ? " Teil" : " Teile"))}</span></summary>`;
    h += topicRow(u.id + "-all", "Alle Teile", setOf(u.id + "-all"), u.id);
    for(const t of parts) h += topicRow(t.id, t.name, SETS[t.id], u.id);
    h += `</details>`;
  }

  view.innerHTML = h;
  document.getElementById("yback").onclick = () => { S.view = "home"; render(); };
  document.getElementById("ydir").onclick = () => {
    S.dir = S.dir === "en2de" ? "de2en" : "en2de"; render();
  };
  view.querySelectorAll("[data-topic]").forEach(b =>
    b.addEventListener("click", () => startSession(b.dataset.topic)));
  updateFoot();
}

/* =========================================================================
   SITZUNG
   ========================================================================= */
function buildQueue(){
  let all = setOf(S.topicId);
  if(S.mode === "cloze") all = all.filter(hasCloze);
  if(!all.length){ S.queue = []; S.i = 0; return; }
  const pool = S.onlyDue ? all.filter(v=>isDue(rec(S.dir,v.id))) : all;
  S.queue = shuffle(pool.length ? pool : all);
  S.i = 0; S.revealed = false; S.answered = null;
}
function startSession(topicId){
  S.topicId = topicId; S.view = "session"; S.seen = 0;
  buildQueue(); render();
}
function current(){ return S.queue[S.i]; }

/* Unit-Klasse der laufenden Sitzung: nur wenn die Auswahl zu genau einer
   Unit gehoert. Beim ganzen Buch gibt es keine eindeutige Farbe. */
function sessionUnit(){
  const t = TOPICS.filter(x => x.id === S.topicId)[0];
  if(t) return t.unit;
  const m = /^(u\d+)-all$/.exec(S.topicId || "");
  return m ? m[1] : "";
}

function renderSession(){
  if(!S.queue.length){
    view.innerHTML = `<div class="done"><h2>Keine Karten</h2>
      <p>In dieser Auswahl gibt es für den Lückensatz-Modus noch keine Beispielsätze.
         Nutze so lange „Tippen“.</p>
      <div class="controls"><button class="primary" id="home">Zurück zur Übersicht</button></div></div>`;
    document.getElementById("home").onclick = () => { S.view="year"; S.mode="card"; render(); };
    return;
  }
  if(S.i >= S.queue.length){ renderDone(); return; }
  const v = current();
  const r = rec(S.dir, v.id);
  const setNow = setOf(S.topicId);

  const rail = [1,2,3,4,5].map(n=>{
    const cls = (n===r.box?"here":"") + (S.landed===n?" land":"");
    return `<div class="slot ${cls}"><div class="n">FACH ${n}</div>
      <div class="c">${boxCounts(setNow,S.dir)[n-1]}</div>
      <div class="iv">${n===1?"sofort":INTERVALS[n]+" d"}</div></div>`;
  }).join("");

  let body = `<div class="eyebrow ${sessionUnit()}">
      <span>${esc(topicName(S.topicId))}</span>
      <span>${S.i+1} / ${S.queue.length}</span>
    </div>`;

  if(S.mode === "card"){
    body += promptBlock(v);
    if(S.revealed){
      body += answerBlock(v);
    }
    body += `<div class="spacer"></div>`;
  }

  if(S.mode === "mc"){
    if(!S.options) S.options = shuffle([v, ...buildDistractors(v)]);
    body += promptBlock(v) + `<div class="opts">`;
    for(const o of S.options){
      let cls = "";
      if(S.answered){
        if(o.id===v.id) cls = "right";
        else if(o.id===S.answered) cls = "wrong";
      }
      body += `<button class="opt ${cls}" data-opt="${o.id}" ${S.answered?"disabled":""}>
        ${esc(ansSide(o))}</button>`;
    }
    body += `</div>`;
    if(S.answered) body += answerBlock(v, true);
    body += `<div class="spacer"></div>`;
  }

  if(S.mode === "type"){
    body += promptBlock(v) + `
      <div class="typebox">
        <input id="typeIn" placeholder="${S.dir==="en2de"?"Deutsche Bedeutung":"mot français"}"
               autocomplete="off" autocapitalize="off" spellcheck="false" ${S.answered?"disabled":""}>
        <div class="verdict" id="verdict"></div>
      </div>`;
    if(S.answered) body += answerBlock(v, true);
    body += `<div class="spacer"></div>`;
  }

  if(S.mode === "cloze"){
    const cp = clozeParts(v);
    body += '<div class="cloze">' + esc(cp.before)
          + (S.answered ? '<b>' + esc(cp.word) + '</b>'
                        : '<span class="gap">?</span>')
          + esc(cp.after) + '</div>'
          + '<div class="clue">gesucht: <span>' + esc(v.de) + '</span>'
          + (v.pos ? ' \u00b7 ' + esc(v.pos) : "") + '</div>'
          + '<div class="typebox">'
          + '<input id="typeIn" placeholder="französisches Wort" autocomplete="off" '
          + 'autocapitalize="off" spellcheck="false" ' + (S.answered ? "disabled" : "") + '>'
          + '<div class="verdict" id="verdict"></div></div>';
    if(S.answered) body += answerBlock(v, true);
    body += '<div class="spacer"></div>';
  }

  const controls = S.revealed || S.answered
    ? `<button class="rate again" data-rate="0">Nochmal<span>1</span></button>
       <button class="rate hard"  data-rate="1">Unsicher<span>2</span></button>
       <button class="rate good"  data-rate="2">Gewusst<span>3</span></button>`
    : (S.mode==="card"
        ? `<button class="primary" id="flip">Umdrehen <span style="opacity:.6">(Leertaste)</span></button>`
        : ((S.mode==="type" || S.mode==="cloze")
            ? `<button class="primary" id="submit">Prüfen (Enter)</button>` : ""));

  view.innerHTML = `
    <div class="sessionbar">
      <button class="linkbtn" id="back">← Übersicht</button>
      <div class="switches">
        <button class="switch" data-mode="card" aria-pressed="${S.mode==="card"}">Karteikarte</button>
        <button class="switch" data-mode="mc"   aria-pressed="${S.mode==="mc"}">Auswahl</button>
        <button class="switch" data-mode="type" aria-pressed="${S.mode==="type"}">Tippen</button>
        <button class="switch" data-mode="cloze" aria-pressed="${S.mode==="cloze"}">Lückensatz</button>

/* Zerlegt den Beispielsatz in Teil vor der Vokabel, Vokabel, Teil danach.
   Versucht zuerst die ganze Wendung, dann das erste Wort mit Endungen.
   Gibt null zurueck, wenn die Vokabel im Satz nicht auffindbar ist. */
function clozeParts(v){
  var ex = v.example_en;
  if(!ex) return null;
  var core = String(v.en).replace(/\([^)]*\)/g, " ").split("/")[0];
  core = core.replace(/^\s*to\s+/i, "").replace(/\.{2,}|…/g, " ").replace(/\s+/g, " ").trim().replace(/[.!?]$/, "");
  if(!core) return null;
  var esc0 = function(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); };

  var words = core.split(" ");
  var tries = [words.map(esc0).join("\\s+") + "\\b"];
  if(words.length > 1){
    tries.push(words.map(esc0).join("\\s+") + "\\w*");           // ganze Wendung
    tries.push(esc0(words[words.length - 1]) + "\\w*");          // letztes Wort
  }
  var first = words[0];
  tries.push(esc0(first.slice(0, Math.max(4, first.length - 3))) + "\\w*");

  for(var i = 0; i < tries.length; i++){
    var m = ex.match(new RegExp("\\b(" + tries[i] + ")", "i"));
    if(m && m.index !== undefined && m[1].length > 2){
      return {before: ex.slice(0, m.index), word: m[1],
              after: ex.slice(m.index + m[1].length), core: core};
    }
  }
  return null;
}

function hasCloze(v){ return clozeParts(v) !== null; }

function promptBlock(v){
  const englishAsked = S.dir === "en2de";
  const phon = englishAsked && (v.ipa || Speech.available)
    ? `<div class="phon">
         ${v.ipa ? `<span class="ipa">/${esc(v.ipa.replace(/^\/|\/$/g, ""))}/</span>` : ""}
         ${speakBtn(v.en)}
       </div>`
    : "";
  const sense = (v.sense_en && S.dir === "en2de")
    ? `<div class="sense">${esc(v.sense_en)}</div>` : "";
  return `<h2 class="prompt">${esc(askSide(v))}</h2>
    <div class="pos">${esc(v.pos)}</div>${phon}${sense}`;
}

/* Distraktoren: erst die gepflegten Verwechslungskandidaten, dann Zufall
   aus demselben Thema. Freie Paare bekommen eine synthetische ID. */
function buildDistractors(v){
  const out = [];
  const set = setOf(S.topicId);
  let n = 0;
  for(const h of (v.distractor_hint || [])){
    if(typeof h === "string"){
      const found = set.find(x => x.id === h);
      if(found && found.id !== v.id) out.push(found);
    }else if(h && h.en && h.de){
      out.push({id:"hint-"+v.id+"-"+(n++), en:h.en, de:h.de, pos:v.pos, hint:true});
    }
  }
  const used = new Set([v.id, ...out.map(o=>o.id)]);
  const rest = shuffle(set.filter(x => !used.has(x.id) && x.en !== v.en));
  return [...out, ...rest].slice(0,3);
}

function answerBlock(v, compact){
  const englishIsAnswer = S.dir === "de2en";
  const phon = englishIsAnswer && (v.ipa || Speech.available)
    ? `<div class="phon">
         ${v.ipa ? `<span class="ipa">/${esc(v.ipa.replace(/^\/|\/$/g, ""))}/</span>` : ""}
         ${speakBtn(v.en)}
       </div>`
    : "";
  return `<div class="answer">
    ${compact ? "" : `<div class="de">${esc(ansSide(v))}</div>`}
    ${phon}
    ${v.collocations ? `<div class="coll">${esc(v.collocations)}</div>` : ""}
    ${v.example_en ? `<div class="ex">${markExample(v.example_en, v.en, v.luecke, v.luecke_bei)}
      ${speakBtn(v.example_en)}</div>` : ""}
  </div>`;
}

function bindSession(){
  document.getElementById("back").onclick = () => { S.view="year"; S.options=null; render(); };
  const dirB = document.getElementById("dirBtn");
  if(dirB) dirB.onclick = () => {
    S.dir = S.dir==="en2de" ? "de2en" : "en2de";
    S.options=null; buildQueue(); render();
  };
  view.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    const was = S.mode;
    S.mode = b.dataset.mode; S.revealed=false; S.answered=null; S.options=null;
    if(was === "cloze" || S.mode === "cloze") buildQueue();
    render();
  });
  const flip = document.getElementById("flip");
  if(flip) flip.onclick = () => { S.revealed = true; render(); };

  view.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    S.answered = b.dataset.opt;
    render();
  });

  const sub = document.getElementById("submit");
  if(sub) sub.onclick = submitTyped;

  view.querySelectorAll("[data-rate]").forEach(b =>
    b.onclick = () => rate(Number(b.dataset.rate)));

  view.querySelectorAll("[data-say]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    Speech.say(b.dataset.say, b);
  });
}

function submitTyped(){
  const inp = document.getElementById("typeIn");
  if(!inp) return;
  const v = current();
  let res;
  if(S.mode === "cloze"){
    const cp = clozeParts(v);
    res = checkTyped(inp.value, cp.word);
    if(res !== "ok") {
      const alt = checkTyped(inp.value, cp.core);
      if(alt === "ok" || (alt === "near" && res === "no")) res = alt;
    }
  }else{
    res = checkTyped(inp.value, ansSide(v));
  }
  S.answered = res;
  window.LearningFeedback?.signal(res === "ok" ? "ok" : res === "near" ? "near" : "no");
  render();
  const el = document.getElementById("verdict");
  if(el){
    el.className = "verdict " + res;
    const sol = S.mode === "cloze" ? clozeParts(v).word : ansSide(v);
    el.innerHTML = res==="ok"   ? "Richtig."
                 : res==="near" ? `Fast – Schreibweise prüfen.<span class="sol">${esc(sol)}</span>`
                 :                `Noch nicht.<span class="sol">${esc(sol)}</span>`;
  }
}

function rate(quality){
  window.LearningFeedback?.signal(quality === 0 ? "no" : quality === 1 ? "near" : "ok");
  const v = current();
  const r = rec(S.dir, v.id);
  if(quality === 0)       r.box = 1;
  else if(quality === 1)  r.box = Math.max(1, r.box - 1);
  else                    r.box = Math.min(5, r.box + 1);
  r.due = Date.now() + INTERVALS[r.box] * DAY;
  save();
  S.landed = r.box;
  S.seen++;
  S.i++; S.revealed=false; S.answered=null; S.options=null;
  render();
  setTimeout(()=>{ S.landed=null; }, 500);
}

function renderDone(){
  const setNow = setOf(S.topicId);
  const c = boxCounts(setNow, S.dir);
  const total = setNow.length;
  view.innerHTML = `<div class="done">
    <h2>Durchgang beendet</h2>
    <p>${S.seen} Karten bearbeitet · ${c[4]} von ${total} in Fach 5</p>
    <div class="controls">
      <button class="primary" id="again">Weiter üben</button>
      <button id="home">Übersicht</button>
    </div></div>`;
  document.getElementById("again").onclick = () => {
    S.onlyDue = false; buildQueue(); S.seen = 0; render();
  };
  document.getElementById("home").onclick = () => { S.view="year"; render(); };
  updateFoot();
}

/* Exportiert die gerade sichtbaren Zeilen als Tabelle (Tab-getrennt,
   mit BOM, damit Excel die Umlaute richtig liest). */
function exportCsv(box){
  var cols = ["Thema","fr","de","pos","ipa","collocations","beispiel"];
  var rows = [cols.join("\t")];
  var n = 0;

  for(var i = 0; i < TOPICS.length; i++){
    var t = TOPICS[i];
    var entries = SETS[t.id];
    if(!entries) continue;
    var sec = box.querySelector('details[data-sec="' + t.id + '"]');
    if(!sec || sec.className.indexOf("off") !== -1) continue;
    var domRows = sec.querySelectorAll(".vrow");

    for(var j = 0; j < entries.length; j++){
      if(domRows[j] && domRows[j].className.indexOf("off") !== -1) continue;
      var e = entries[j];
      var cell = function(x){ return String(x == null ? "" : x).replace(/[\t\r\n]+/g, " "); };
      rows.push([t.unitName + " / " + t.name, e.en, e.de, e.pos || "", e.ipa || "",
                 e.collocations || "", e.example_en || ""].map(cell).join("\t"));
      n++;
    }
  }

  if(!n){ alert("Nichts zu exportieren \u2013 die Suche liefert keine Treffer."); return; }
  try{
    var blob = new Blob(["\ufeff" + rows.join("\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "vokabeln.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(err){ alert("Der Export hat nicht funktioniert: " + err.message); }
}

function applyListPrefs(box){
  box.className = "vlist" + (LIST_PREFS.ex ? "" : " hide-ex")
                          + (LIST_PREFS.ipa ? "" : " hide-ipa");
}

function filterList(box, raw){
  var term = String(raw || "").toLowerCase().trim();
  var secs = box.querySelectorAll("details.lsec");
  var hits = 0;

  for(var i = 0; i < secs.length; i++){
    var sec = secs[i];
    var rows = sec.querySelectorAll(".vrow");
    var shown = 0;
    for(var j = 0; j < rows.length; j++){
      var match = !term || rows[j].getAttribute("data-s").indexOf(term) !== -1;
      rows[j].className = "vrow" + (match ? "" : " off");
      if(match) shown++;
    }
    hits += shown;
    sec.className = "lsec" + (shown ? "" : " off");
    if(term) sec.open = shown > 0;
  }

  document.getElementById("lnone").hidden = !(term && hits === 0);
  document.getElementById("lcount").textContent = term
    ? hits + " Treffer f\u00fcr \u201e" + raw.trim() + "\u201c"
    : box.querySelectorAll(".vrow").length + " Vokabeln in "
      + Object.keys(SETS).length + " Themen \u00b7 Thema antippen zum \u00d6ffnen";
}

/* =========================================================================
   TASTATUR
   ========================================================================= */
document.addEventListener("keydown", e => {
  if(S.view !== "session") return;
  const typing = document.activeElement && document.activeElement.id === "typeIn";
  if(typing && e.key === "Enter"){ e.preventDefault(); submitTyped(); return; }
  if(typing && !S.answered) return;
  if((e.key === "s" || e.key === "S") && current()){
    e.preventDefault(); Speech.say(current().en); return;
  }
  if(e.key === " " && S.mode === "card" && !S.revealed){
    e.preventDefault(); S.revealed = true; render(); return;
  }
  if((S.revealed || S.answered) && ["1","2","3"].includes(e.key)){
    e.preventDefault(); rate(Number(e.key) - 1);
  }
});

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(progress,null,1)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "vokabelfortschritt.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = ev => {
  const f = ev.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{ progress = JSON.parse(fr.result); save(); render(); }
    catch(e){ alert("Die Datei konnte nicht gelesen werden."); }
  };
  fr.readAsText(f);
};

function updateFoot(){
  let done = 0, all = 0;
  for(const t of TOPICS){
    if(!SETS[t.id]) continue;
    all += SETS[t.id].length;
    done += boxCounts(SETS[t.id], S.dir).slice(2).reduce((a,b)=>a+b,0);
  }
  document.getElementById("footstat").textContent =
    `${done}/${all} SICHER · ${dirLabel()}`;
}

function render(){
  if(S.view === "home") return renderHome();
  if(S.view === "year") return renderYear();
  if(S.view === "list") return renderList();
  if(S.view === "help") return renderHelp();
  return renderSession();
}

if(!Store.persistent){

     dauerhaften Speicher. Der Fortschritt gilt nur fuer diese Sitzung. Lade die Datei
     herunter und oeffne sie per Doppelklick \u2013 dort bleibt der Lernstand erhalten.</div>`);
}

try{
  render();
}catch(err){
  showWarn('<div class="warn"><b>Beim Aufbau der Seite ist ein Fehler aufgetreten.</b><br>'
    + '<span style="font-family:var(--mono);font-size:11px">' + err.message + '</span></div>');
}
